name: Check links

on:
  schedule:
    - cron: "17 12 1 * *" # 1st of each month, about 8 AM Eastern
  workflow_dispatch: # adds a "Run workflow" button in the Actions tab

permissions:
  contents: read
  issues: write

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Program links live in the page's data, so pull them into a plain list first.
      - name: List links
        run: grep -oE 'https?://[^"<> \\]+' index.html | sort -u > links.txt

      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          fail: false
          format: markdown
          output: ./link-report.md
          args: >-
            --no-progress
            --max-concurrency 8
            --max-retries 3
            --retry-wait-time 5
            --timeout 30
            --user-agent "Mozilla/5.0 (compatible; RhetComp-Program-Finder-link-check)"
            --accept 200..=299,403,429
            links.txt

      - name: Open an issue if links are broken
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: Broken links found
          content-filepath: ./link-report.md
